<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1: Python Syntax Basics Quiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Courier New', monospace;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .card-header {
            background-color: #2ecc71;
            color: #fff;
        }
        .correct-answer { color: #27ae60; font-weight: bold; }
        .user-incorrect { color: #e74c3c; }
        .answer { display: none; margin-top: 8px; }
        .code-example {
            background-color: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="my-4">Week 1: Python Syntax Basics Quiz</h1>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Test Your Python Knowledge</h5>
            </div>
            <div class="card-body">
                <form id="quizForm">
                    <!-- Question 1 -->
                    <div class="mb-4">
                        <label class="form-label">1. What is used to define code blocks in Python?</label>
                        <select class="form-select" name="q1" required>
                            <option value="">Select an option</option>
                            <option value="Braces">Braces {}</option>
                            <option value="Indentation">Indentation</option>
                            <option value="Parentheses">Parentheses ()</option>
                            <option value="Semicolons">Semicolons ;</option>
                        </select>
                        <div class="answer correct-answer">Correct Answer: Indentation</div>
                    </div>

                    <!-- Question 2 -->
                    <div class="mb-4">
                        <label class="form-label">2. Which operator is used for exponentiation?</label>
                        <select class="form-select" name="q2" required>
                            <option value="">Select an option</option>
                            <option value="^">^</option>
                            <option value="**">**</option>
                            <option value="^^">^^</option>
                            <option value="//">//</option>
                        </select>
                        <div class="answer correct-answer">Correct Answer: **</div>
                    </div>

                    <!-- Question 3 -->
                    <div class="mb-4">
                        <label class="form-label">3. What is the output of type(3.14)?</label>
                        <select class="form-select" name="q3" required>
                            <option value="">Select an option</option>
                            <option value="int">int</option>
                            <option value="float">float</option>
                            <option value="double">double</option>
                            <option value="decimal">decimal</option>
                        </select>
                        <div class="answer correct-answer">Correct Answer: float</div>
                    </div>

                    <!-- Question 4 -->
                    <div class="mb-4">
                        <label class="form-label">4. Which is a valid variable name?</label>
                        <select class="form-select" name="q4" required>
                            <option value="">Select an option</option>
                            <option value="2nd_name">2nd_name</option>
                            <option value="first-name">first-name</option>
                            <option value="_age">_age</option>
                            <option value="break">break</option>
                        </select>
                        <div class="answer correct-answer">Correct Answer: _age</div>
                    </div>

                    <!-- Question 5 -->
                    <div class="mb-4">
                        <label class="form-label">5. What does input() return by default?</label>
                        <select class="form-select" name="q5" required>
                            <option value="">Select an option</option>
                            <option value="integer">Integer</option>
                            <option value="float">Float</option>
                            <option value="string">String</option>
                            <option value="boolean">Boolean</option>
                        </select>
                        <div class="answer correct-answer">Correct Answer: String</div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-success">Submit Quiz</button>
                        <a href="week1_content.html" class="btn btn-outline-secondary">Back to Week 1</a>
                        <a href="week2_preview.html" class="btn btn-outline-success">Week 2 Preview</a>
                    </div>
                </form>
                <div id="quizResult" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('quizForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const correctAnswers = {
                q1: 'Indentation',
                q2: '**',
                q3: 'float',
                q4: '_age',
                q5: 'String'
            };

            let score = 0;
            const answerElements = document.querySelectorAll('.answer');

            // Reset previous feedback
            answerElements.forEach(answer => answer.style.display = 'none');
            document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));

            // Check answers
            for (const [question, correctAnswer] of Object.entries(correctAnswers)) {
                const selected = this.elements[question].value;
                const questionElement = this.elements[question].closest('.mb-4');

                if (selected === correctAnswer) {
                    score++;
                    questionElement.querySelector('.answer').style.display = 'block';
                } else {
                    questionElement.classList.add('user-incorrect');
                    this.elements[question].classList.add('is-invalid');
                    questionElement.querySelector('.answer').style.display = 'block';
                }
            }

            // Display results
            const resultDiv = document.getElementById('quizResult');
            resultDiv.innerHTML = `
                <div class="alert ${score === 5 ? 'alert-success' : 'alert-warning'}">
                    Score: ${score}/5 (${(score/5*100).toFixed(1)}%)<br>
                    ${score === 5 ? 'Great job! You mastered Python basics!' : 'Review the incorrect answers and try again!'}
                </div>
            `;
        });
    </script>
</body>
</html>
